[package]
name = "metacleaner-docs"
description = "Strip identifying metadata (author, company, revision history, custom tracking properties) from zip+XML office document formats: DOCX, XLSX, PPTX, EPUB."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
thiserror = "1"
