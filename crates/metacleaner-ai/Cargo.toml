[package]
name = "metacleaner-ai"
description = "Real AI super-resolution (Real-ESRGAN, bundled as ONNX) for metacleaner. Separate from metacleaner-core: this pulls in a native ONNX Runtime and a bundled model, which metacleaner-core deliberately avoids so it stays reusable from a WASM build."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
image = { version = "0.25", default-features = false }
ort = "2.0.0-rc.13"
ndarray = "0.16"
thiserror = "1"
