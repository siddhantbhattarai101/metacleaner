<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metacleaner</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3l7 3v5c0 4.6-3 8.4-7 9.6-4-1.2-7-5-7-9.6V6l7-3z" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 12.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <h1>metacleaner</h1>
  </div>
  <div class="header-note"><span class="dot" aria-hidden="true"></span> Running locally &middot; nothing leaves this device</div>
</header>

<main>
  <section id="drop-zone" class="drop-zone">
    <p><strong>Drop images here</strong> or</p>
    <label class="file-picker">
      Choose files
      <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.webp,.bmp,.gif,.tif,.tiff">
    </label>
    <p class="hint">JPEG, PNG, WebP, BMP, GIF, TIFF &middot; each file is inspected automatically on drop</p>
    <p id="drop-confirm" class="drop-confirm" hidden></p>
  </section>

  <section id="options" class="options">
    <h2>Options</h2>
    <div class="options-simple">
      <label class="toggle-row">
        <input type="checkbox" id="opt-enhance">
        <span class="toggle-row-text">
          <strong>Enhance quality</strong>
          <span class="option-help">Sharpens detail and evens out contrast. Off by default &mdash; only changes pixels if you turn it on.</span>
        </span>
      </label>
      <label class="toggle-row">
        <span class="toggle-row-label-only">
          <strong>Upscale</strong>
          <span id="upscale-help" class="option-help">Enlarges the image using high-quality resampling &mdash; sharper resize, doesn't invent detail that wasn't captured.</span>
        </span>
        <select id="opt-upscale-mode">
          <option value="none">No upscale</option>
          <option value="classical-2">2&times; size (resize)</option>
          <option value="classical-4">4&times; size (resize)</option>
          <option value="ai-4">AI 4&times; (HD upscale)</option>
        </select>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="opt-fingerprint">
        <span class="toggle-row-text">
          <strong>Also scramble the digital fingerprint</strong>
          <span class="option-help">Adds invisible pixel noise so an old copy of this file can't be hash-matched back to your download. Optional &mdash; leave off for maximum quality.</span>
        </span>
      </label>

      <div id="noise-level-row" class="nested-option" hidden>
        <label for="opt-noise-level">How much noise?</label>
        <select id="opt-noise-level">
          <option value="light">Light &mdash; barely detectable</option>
          <option value="medium" selected>Medium &mdash; recommended</option>
          <option value="strong">Strong &mdash; more disruptive, still invisible to the eye</option>
        </select>
      </div>
    </div>

    <details id="advanced-details" class="advanced">
      <summary>Advanced settings</summary>
      <div class="options-grid">
        <label>Output format
          <select id="opt-format">
            <option value="">Keep original</option>
            <option value="jpeg">JPEG</option>
            <option value="png">PNG (lossless)</option>
            <option value="webp">WebP</option>
            <option value="bmp">BMP (large, uncompressed)</option>
            <option value="gif">GIF (256 colors &mdash; visible loss on photos)</option>
            <option value="tiff">TIFF</option>
          </select>
        </label>
        <label>JPEG quality <span class="option-help">Only applies when the output is a JPEG &mdash; ignored for PNG/WebP/BMP/GIF/TIFF. Higher = larger file, less compression loss.</span>
          <input type="range" id="opt-quality" min="50" max="100" value="95">
          <span id="opt-quality-val">95</span>
        </label>
      </div>
    </details>
  </section>

  <section id="file-list-section" class="file-list-section" hidden>
    <div class="file-list-header">
      <h2>Files <span id="file-count" class="file-count"></span></h2>
      <div class="file-list-actions">
        <button id="clear-all-btn" class="secondary-btn">Clear all</button>
        <button id="clean-all-btn" class="primary-btn">Clean &amp; download all</button>
      </div>
    </div>
    <div id="file-list" class="file-list"></div>
  </section>
</main>

<footer>
  <p>metacleaner &middot; processed locally, never uploaded anywhere &middot; <a href="https://github.com/siddhantbhattarai101/metacleaner" target="_blank" rel="noopener">source</a></p>
</footer>

<script src="/app.js"></script>
</body>
</html>
