[package]
name = "metacleaner-cli"
description = "CLI for metacleaner-core: strip EXIF/GPS/XMP/IPTC/C2PA/AI-generation metadata from images."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "metaclean"
path = "src/main.rs"

[dependencies]
metacleaner-core = { path = "../metacleaner-core" }
metacleaner-ai = { path = "../metacleaner-ai" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
base64 = "0.22"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
