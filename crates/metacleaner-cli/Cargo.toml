[package]
name = "metacleaner-cli"
description = "CLI for metacleaner-core: strip EXIF/GPS/XMP/IPTC/C2PA/AI-generation metadata from images."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "metaclean"
path = "src/main.rs"

[dependencies]
metacleaner-core = { path = "../metacleaner-core" }
clap = { version = "4", features = ["derive"] }
