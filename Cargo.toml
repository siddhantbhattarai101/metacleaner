[workspace]
resolver = "2"
members = [
    "crates/metacleaner-core",
    "crates/metacleaner-cli",
    "crates/metacleaner-ai",
    "crates/metacleaner-text",
    "crates/metacleaner-docs",
    "crates/metacleaner-pdf",
    "crates/metacleaner-media",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["websearchpro"]

[profile.release]
opt-level = 3
lto = true
